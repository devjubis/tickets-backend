name: CI Backend

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickets-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testar e verificar cobertura
        run: ./mvnw -B verify

      - name: Publicar relatório de testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit
          path: tickets-api/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Comentar cobertura no PR
        uses: madrapps/jacoco-report@v1.7
        if: github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/tickets-api/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 75
          min-coverage-changed-files: 85

      - name: Guardar o artefacto do build
        uses: actions/upload-artifact@v4
        with:
          name: tickets-api-jar
          path: tickets-api/target/*.jar
          retention-days: 7
