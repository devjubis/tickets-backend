spring.application.name=tickets-api

# Credenciais locais: carregadas do .env (ver .env.example).
# O ficheiro fica na raiz de tickets-backend/ para ser partilhado com o
# docker-compose.yml; as duas entradas cobrem o arranque a partir do modulo
# (./mvnw na pasta tickets-api) ou da raiz do backend. Ambas sao opcionais,
# pelo que em producao as variaveis vem do ambiente/Secret Manager.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Conexao com o PostgreSQL (docker-compose.yml)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
# O esquema pertence ao Flyway. O Hibernate apenas valida que o mapeamento
# corresponde as tabelas existentes e falha o arranque quando divergem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# Falha o arranque se a pasta de migracoes desaparecer, em vez de a ignorar
# em silencio e subir com o esquema por aplicar.
spring.flyway.fail-on-missing-locations=true
